{% extends 'base.html' %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="row justify-content-center mt-md-5">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="text-center mb-4">
      <div class="display-5 text-primary"><i class="bi bi-chat-dots-fill"></i></div>
      <h1 class="h3 fw-semibold">SMS Sender</h1>
      <p class="text-body-secondary">Log in to send SMS messages.</p>
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        {% if form.non_field_errors %}
          <div class="alert alert-danger py-2">
            {% for error in form.non_field_errors %}{{ error }}{% endfor %}
          </div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" name="username" id="id_username" class="form-control" autofocus required
                   autocomplete="username" value="{{ form.username.value|default:'' }}">
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" id="id_password" class="form-control" required
                   autocomplete="current-password">
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Log in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
